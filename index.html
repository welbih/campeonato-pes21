<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campeonato PES 21 | Tecno vs Vila</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Inter:wght@400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#050b24;
    --navy2:#0a1445;
    --blue:#1b3bff;
    --gold:#f5c542;
    --gold2:#ffe58a;
    --silver:#cfd8e6;
    --silver2:#8fa0b8;
    --bronze:#cd7f32;
    --white:#f4f7ff;
    --vila:#19c37d;
    --tecno:#ff4d6d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Inter',sans-serif;
    color:var(--white);
    background:
      radial-gradient(1200px 600px at 50% -10%, #1a2fb8 0%, transparent 60%),
      radial-gradient(800px 500px at 100% 40%, #0d1f7a55 0%, transparent 60%),
      linear-gradient(180deg,var(--navy2),var(--navy) 60%);
    min-height:100vh;
    overflow-x:hidden;
  }
  /* estrelas de fundo */
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
    background-image:
      radial-gradient(2px 2px at 20% 30%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 70% 20%, #fff, transparent),
      radial-gradient(2px 2px at 40% 70%, var(--gold2), transparent),
      radial-gradient(1.5px 1.5px at 85% 80%, #fff, transparent),
      radial-gradient(1px 1px at 10% 85%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 55% 45%, #fff, transparent);
    background-size:600px 600px;
    animation:twinkle 6s ease-in-out infinite alternate;
  }
  @keyframes twinkle{from{opacity:.25}to{opacity:.6}}
  main{position:relative;z-index:1}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px}

  /* HERO */
  header.hero{text-align:center;padding:70px 20px 50px;position:relative}
  .ball{
    width:92px;height:92px;margin:0 auto 18px;border-radius:50%;
    background:
      radial-gradient(circle at 30% 30%, #fff, #dfe6f5 55%, #9fb0cf);
    position:relative;box-shadow:0 0 50px #4f6bff88, inset -8px -10px 18px #0003;
    animation:float 4s ease-in-out infinite;
  }
  .ball::before{ /* pentágono central */
    content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;
    transform:translate(-50%,-50%);background:#0b1030;
    clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);
  }
  .ball::after{
    content:"";position:absolute;inset:0;border-radius:50%;
    background:
      radial-gradient(circle at 50% 4%, #0b1030 0 9px, transparent 10px),
      radial-gradient(circle at 96% 42%, #0b1030 0 9px, transparent 10px),
      radial-gradient(circle at 80% 92%, #0b1030 0 9px, transparent 10px),
      radial-gradient(circle at 20% 92%, #0b1030 0 9px, transparent 10px),
      radial-gradient(circle at 4% 42%, #0b1030 0 9px, transparent 10px);
  }
  @keyframes float{50%{transform:translateY(-10px)}}
  .eyebrow{
    font-family:'Oswald',sans-serif;letter-spacing:.45em;text-transform:uppercase;
    color:var(--gold);font-size:.85rem;
  }
  h1{
    font-family:'Bebas Neue',sans-serif;font-weight:400;
    font-size:clamp(2.6rem,8.5vw,5.4rem);line-height:.95;margin:10px 0;
    background:linear-gradient(180deg,#fff 10%,var(--gold2) 55%,var(--gold) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 40px #f5c54233;
  }
  .sub{color:var(--silver);max-width:560px;margin:0 auto;font-size:1.05rem}
  .versus{
    display:inline-flex;align-items:center;gap:14px;margin-top:26px;
    font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.2em;
  }
  .pill{padding:8px 20px;border-radius:999px;font-weight:700;font-size:.9rem}
  .pill.tecno{background:#ff4d6d22;border:1px solid var(--tecno);color:#ff8fa3}
  .pill.vila{background:#19c37d22;border:1px solid var(--vila);color:#6ff0b5}
  .vs{color:var(--gold);font-size:1.3rem}

  /* títulos de seção */
  .section{padding:40px 0}
  .section-title{
    display:flex;align-items:center;gap:16px;margin-bottom:30px;
    font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.2em;
    font-size:1.4rem;
  }
  .section-title::before,.section-title::after{
    content:"";flex:1;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  .section-title span{color:var(--gold)}

  /* DESTAQUES */
  .highlights{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
  .hl{
    position:relative;border-radius:20px;padding:28px 24px;overflow:hidden;
    background:linear-gradient(145deg,#12206b,#0a1240);
    border:1px solid #ffffff22;
    box-shadow:0 20px 40px #0008;
  }
  .hl::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;
  }
  .hl.gold::before{background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold))}
  .hl.silver::before{background:linear-gradient(90deg,var(--silver2),#fff,var(--silver2))}
  .hl .label{
    font-family:'Oswald',sans-serif;letter-spacing:.25em;text-transform:uppercase;
    font-size:.78rem;color:var(--silver2);
  }
  .hl .big{
    font-family:'Bebas Neue',sans-serif;font-size:2.6rem;line-height:1.05;margin:8px 0;
  }
  .hl.gold .big{color:var(--gold)}
  .hl.silver .big{color:var(--silver)}
  .hl .note{color:var(--silver);font-size:.92rem}
  .hl .icon{position:absolute;right:16px;bottom:-14px;font-size:6rem;opacity:.12}
  .tag{
    display:inline-block;margin:6px 6px 0 0;padding:4px 12px;border-radius:999px;
    background:#ffffff14;border:1px solid #ffffff25;font-size:.85rem;font-weight:600;
  }

  /* EDIÇÕES */
  .editions{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
  .edition{
    border-radius:22px;padding:26px 22px 24px;position:relative;
    background:linear-gradient(160deg,#101c63 0%,#080f33 100%);
    border:1px solid #ffffff1f;box-shadow:0 22px 44px #0009;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .edition:hover{transform:translateY(-6px);box-shadow:0 28px 56px #000b,0 0 40px #1b3bff44}
  .edition .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .ed-name{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.15em;font-size:1rem}
  .badge{
    font-family:'Oswald',sans-serif;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;
    padding:4px 12px;border-radius:999px;font-weight:700;
  }
  .badge.vila{background:#19c37d22;color:#6ff0b5;border:1px solid var(--vila)}
  .badge.tecno{background:#ff4d6d22;color:#ff8fa3;border:1px solid var(--tecno)}
  .final{display:grid;gap:12px}
  .place{
    display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;
    border:1px solid #ffffff1a;
  }
  .place.first{
    background:linear-gradient(100deg,#f5c54233,#f5c54208);
    border-color:#f5c54266;
  }
  .place.second{
    background:linear-gradient(100deg,#cfd8e625,#cfd8e605);
    border-color:#cfd8e655;
  }
  .medal{
    width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:#1a1400;
  }
  .first .medal{background:radial-gradient(circle at 30% 30%,#fff3b8,var(--gold) 60%,#b88a10);box-shadow:0 0 18px #f5c54288}
  .second .medal{background:radial-gradient(circle at 30% 30%,#fff,var(--silver) 60%,#8493aa);color:#1a2030}
  .place .role{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--silver2);font-family:'Oswald',sans-serif}
  .place .pname{font-family:'Oswald',sans-serif;font-size:1.5rem;font-weight:700;letter-spacing:.04em}
  .first .pname{color:var(--gold2)}

  /* RANKING */
  .rank{display:grid;gap:16px}
  .rank-card{
    display:grid;grid-template-columns:64px 1fr auto;gap:20px;align-items:center;
    padding:20px 24px;border-radius:20px;position:relative;overflow:hidden;
    background:linear-gradient(120deg,#122070,#080f33);
    border:1px solid #ffffff1f;box-shadow:0 14px 30px #0008;
    transition:transform .2s ease;
  }
  .rank-card:hover{transform:scale(1.015)}
  .rank-card::after{ /* brilho diagonal */
    content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,#ffffff12,transparent);
    transform:skewX(-20deg);transition:left .7s ease;
  }
  .rank-card:hover::after{left:130%}
  .rank-card.top1{border-color:#f5c54299;box-shadow:0 14px 40px #f5c54222}
  .pos{
    width:60px;height:60px;border-radius:14px;display:grid;place-items:center;
    font-family:'Bebas Neue',sans-serif;font-size:2.2rem;
    background:#ffffff12;border:1px solid #ffffff22;
  }
  .top1 .pos{background:linear-gradient(145deg,var(--gold2),var(--gold));color:#1a1400;border:none}
  .rank-card.top2 .pos{background:linear-gradient(145deg,#fff,var(--silver));color:#1a2030;border:none}
  .rank-card.top3 .pos{background:linear-gradient(145deg,#f0b27a,var(--bronze));color:#2a1500;border:none}
  .rank-name{font-family:'Oswald',sans-serif;font-size:1.6rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .rank-sub{color:var(--silver2);font-size:.88rem;margin-top:2px}
  .stats{display:flex;gap:10px}
  .stat{
    min-width:84px;text-align:center;padding:10px 12px;border-radius:12px;
    background:#00000044;border:1px solid #ffffff18;
  }
  .stat b{display:block;font-family:'Bebas Neue',sans-serif;font-size:1.9rem;line-height:1}
  .stat small{font-family:'Oswald',sans-serif;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--silver2)}
  .stat.champ b{color:var(--gold)}
  .stat.vice b{color:var(--silver)}
  .legend{margin-top:16px;text-align:center;color:var(--silver2);font-size:.85rem}

  /* ABAS DO RANKING */
  .tabs{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:24px}
  .tabs button{
    font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.18em;
    font-size:.85rem;padding:10px 22px;border-radius:999px;cursor:pointer;
    color:var(--silver);background:#ffffff0d;border:1px solid #ffffff2a;
    transition:all .2s ease;
  }
  .tabs button:hover{border-color:var(--gold);color:#fff}
  .tabs button.active{
    background:linear-gradient(145deg,var(--gold2),var(--gold));
    color:#1a1400;border-color:transparent;font-weight:700;
    box-shadow:0 0 22px #f5c54255;
  }

  /* NÚMEROS */
  .counters{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
  .counter{
    text-align:center;padding:26px 16px;border-radius:18px;
    background:#ffffff0a;border:1px solid #ffffff1a;
  }
  .counter b{font-family:'Bebas Neue',sans-serif;font-size:3.4rem;color:var(--gold);display:block;line-height:1}
  .counter span{font-family:'Oswald',sans-serif;letter-spacing:.2em;text-transform:uppercase;font-size:.78rem;color:var(--silver)}

  footer{text-align:center;padding:40px 20px 60px;color:var(--silver2);font-size:.85rem}
  footer .gold{color:var(--gold)}

  @media (max-width:640px){
    .rank-card{grid-template-columns:52px 1fr;}
    .rank-card .stats{grid-column:1 / -1;justify-content:space-between}
    .stat{flex:1;min-width:0}
    .pos{width:50px;height:50px;font-size:1.8rem}
  }
</style>
</head>
<body>
<div class="stars"></div>
<main>

  <header class="hero">
    <div class="ball" aria-hidden="true"></div>
    <div class="eyebrow">★ Hall da Fama ★</div>
    <h1>Campeonato PES 21</h1>
    <p class="sub">Campeões e vices das batalhas entre os craques da Tecno e da Vila.</p>
    <div class="versus">
      <span class="pill tecno">Tecno</span><span class="vs">VS</span><span class="pill vila">Vila</span>
    </div>
  </header>

  <div class="wrap">

    <!-- DESTAQUES -->
    <section class="section">
      <h2 class="section-title"><span>Destaques</span></h2>
      <div class="highlights" id="highlights"></div>
    </section>

    <!-- EDIÇÕES -->
    <section class="section">
      <h2 class="section-title"><span>As Finais</span></h2>
      <div class="editions" id="editions"></div>
    </section>

    <!-- RANKING -->
    <section class="section">
      <h2 class="section-title"><span>Rankings</span></h2>
      <div class="tabs" id="tabs"></div>
      <div class="rank" id="rank"></div>
      <p class="legend" id="legend"></p>
    </section>

    <!-- NÚMEROS -->
    <section class="section">
      <h2 class="section-title"><span>Em Números</span></h2>
      <div class="counters" id="counters"></div>
    </section>

  </div>

  <footer>
    <div><span class="gold">★</span> Campeonato PES 21 &mdash; Tecno vs Vila<span class="gold">★</span></div>
  </footer>
</main>

<script>
  // ===== DADOS =====
  const editions = [
    { nome: "1º Campeonato da Vila",  grupo: "vila",  campeao: "Sniper",  vice: "Aomine"  },
    { nome: "2º Campeonato da Vila",  grupo: "vila",  campeao: "Caliton", vice: "Geilson" },
    { nome: "1º Campeonato da Tecno", grupo: "tecno", campeao: "Sniper",  vice: "Geilson" }
  ];

  // ===== CÁLCULOS =====
  const chave  = n => n;
  const rotulo = p => [...p.apelidos].join(" / ");

  function buildRanking(list){
    const players = {};
    list.forEach(e => {
      const idx = editions.indexOf(e);
      [["campeao","titulos"],["vice","vices"]].forEach(([key, field]) => {
        const k = chave(e[key]);
        players[k] ??= { nome:k, apelidos:new Set(), titulos:0, vices:0, primeira:idx, finais:0 };
        players[k].apelidos.add(e[key]);
        players[k][field]++;
        players[k].finais++;
      });
    });
    const sorted = Object.values(players).sort((a,b) =>
      b.titulos - a.titulos || b.vices - a.vices || a.primeira - b.primeira
    );
    // posição com empate (mesmos títulos e vices = mesma posição)
    sorted.forEach((p, i) => {
      const first = sorted.findIndex(q => q.titulos === p.titulos && q.vices === p.vices);
      p.pos = first + 1;
    });
    return sorted;
  }

  const ranking = buildRanking(editions);

  const maxTit = Math.max(...ranking.map(p => p.titulos));
  const maxVic = Math.max(...ranking.map(p => p.vices));
  const maioresCampeoes = ranking.filter(p => p.titulos === maxTit);
  const maioresVices    = ranking.filter(p => p.vices === maxVic);

  const nomes = arr => arr.map(rotulo).join(" · ");
  const tags  = arr => arr.map(p => `<span class="tag">${rotulo(p)}</span>`).join("");

  // ===== DESTAQUES =====
  const empateCampeao = maioresCampeoes.length > 1;
  document.getElementById("highlights").innerHTML = `
    <div class="hl gold">
      <div class="label">Maior campeão${empateCampeao ? " (empate)" : ""}</div>
      <div class="big">${empateCampeao ? maxTit + " título cada" : maioresCampeoes[0].nome}</div>
      <div class="note">${empateCampeao
        ? "Empate no topo da tabela de títulos. A briga está aberta!"
        : maxTit + " títulos conquistados."}</div>
      <div>${tags(maioresCampeoes)}</div>
      <div class="icon">🏆</div>
    </div>
    <div class="hl silver">
      <div class="label">Maior vice</div>
      <div class="big">${nomes(maioresVices)}</div>
      <div class="note">${maxVic} vice-campeonatos. Sempre na final, falta só o título!</div>
      <div>${tags(maioresVices)}</div>
      <div class="icon">🥈</div>
    </div>
    <div class="hl gold">
      <div class="label">Campeões do torneio</div>
      <div class="big">${ranking.filter(p=>p.titulos>0).length} campeões diferentes</div>
      <div class="note">Em ${editions.length} edições, ${ranking.filter(p=>p.titulos>0).length} jogadores já levantaram a taça.</div>
      <div>${tags(ranking.filter(p=>p.titulos>0))}</div>
      <div class="icon">★</div>
    </div>
  `;

  // ===== EDIÇÕES =====
  document.getElementById("editions").innerHTML = editions.map(e => `
    <article class="edition">
      <div class="top">
        <div class="ed-name">${e.nome}</div>
        <span class="badge ${e.grupo}">${e.grupo === "vila" ? "Vila" : "Tecno"}</span>
      </div>
      <div class="final">
        <div class="place first">
          <div class="medal">1</div>
          <div><div class="role">Campeão</div><div class="pname">${e.campeao}</div></div>
        </div>
        <div class="place second">
          <div class="medal">2</div>
          <div><div class="role">Vice-campeão</div><div class="pname">${e.vice}</div></div>
        </div>
      </div>
    </article>
  `).join("");

  // ===== RANKING =====
  const views = {
    geral: { label: "Ranking Geral", rows: ranking,
             info: "Todas as edições somadas (Vila + Tecno)." },
    vila:  { label: "Só Vila", rows: buildRanking(editions.filter(e => e.grupo === "vila")),
             info: "Considera apenas os Campeonatos da Vila." },
    tecno: { label: "Só Tecno", rows: buildRanking(editions.filter(e => e.grupo === "tecno")),
             info: "Considera apenas o Campeonato da Tecno." }
  };

  function renderRank(key){
    const v = views[key];
    document.getElementById("rank").innerHTML = v.rows.map(p => `
      <div class="rank-card ${p.pos<=3 ? "top"+p.pos : ""}">
        <div class="pos">${p.pos}</div>
        <div>
          <div class="rank-name">${rotulo(p)}</div>
          <div class="rank-sub">${p.finais} ${p.finais>1 ? "finais disputadas" : "final disputada"}</div>
        </div>
        <div class="stats">
          <div class="stat champ"><b>${p.titulos}</b><small>Títulos</small></div>
          <div class="stat vice"><b>${p.vices}</b><small>Vices</small></div>
        </div>
      </div>
    `).join("");
    document.getElementById("legend").textContent =
      v.info + " Ordenado por títulos e depois por vices; empatados dividem a posição.";
    document.querySelectorAll("#tabs button").forEach(b =>
      b.classList.toggle("active", b.dataset.key === key));
  }

  document.getElementById("tabs").innerHTML = Object.entries(views).map(([k, v]) =>
    `<button data-key="${k}">${v.label}</button>`).join("");
  document.getElementById("tabs").addEventListener("click", ev => {
    const k = ev.target.dataset.key;
    if (k) renderRank(k);
  });
  renderRank("geral");

  // ===== NÚMEROS =====
  const vilaEd  = editions.filter(e => e.grupo === "vila").length;
  const tecnoEd = editions.filter(e => e.grupo === "tecno").length;
  document.getElementById("counters").innerHTML = [
    [editions.length, "Edições"],
    [vilaEd, "Campeonatos da Vila"],
    [tecnoEd, "Campeonato da Tecno"],
    [ranking.length, "Finalistas"]
  ].map(([n,l]) => `<div class="counter"><b>${n}</b><span>${l}</span></div>`).join("");
</script>
</body>
</html>
