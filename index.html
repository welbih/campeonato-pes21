<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campeonato PES 21 | Tecno vs Vila</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Inter:wght@400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stars"></div>
<main>

  <header class="hero">
    <div class="ball" aria-hidden="true"></div>
    <div class="eyebrow">★ Hall da Fama ★</div>
    <h1>Campeonato PES 21</h1>
    <p class="sub">Campeões e vices das batalhas entre os craques da Tecno e da Vila.</p>
    <div class="versus">
      <span class="pill tecno">Tecno</span><span class="vs">VS</span><span class="pill vila">Vila</span>
    </div>
  </header>

  <div class="wrap">

    <!-- DESTAQUES -->
    <section class="section">
      <h2 class="section-title"><span>Destaques</span></h2>
      <div class="highlights" id="highlights"></div>
    </section>

    <!-- EDIÇÕES -->
    <section class="section">
      <h2 class="section-title"><span>As Finais</span></h2>
      <div class="editions" id="editions"></div>
    </section>

    <!-- RANKING -->
    <section class="section">
      <h2 class="section-title"><span>Rankings</span></h2>
      <div class="tabs" id="tabs"></div>
      <div class="rank" id="rank"></div>
      <p class="legend" id="legend"></p>
    </section>

    <!-- NÚMEROS -->
    <section class="section">
      <h2 class="section-title"><span>Em Números</span></h2>
      <div class="counters" id="counters"></div>
    </section>

  </div>

  <footer>
    <div><span class="gold">★</span> Campeonato PES 21 &mdash; Tecno vs Vila<span class="gold">★</span></div>
  </footer>
</main>

<script src="main.js" defer></script>
</body>
</html>
